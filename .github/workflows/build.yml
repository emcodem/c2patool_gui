name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rust-targets: ""
            tauri-args: ""
            artifact-name: C2PA-Inspector-windows-x64.exe
            built-path: src-tauri/target/release/tauri-app.exe
          - os: macos-latest
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
            tauri-args: "--target universal-apple-darwin"
            artifact-name: C2PA-Inspector-macos-universal
            built-path: src-tauri/target/universal-apple-darwin/release/tauri-app

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Set version from git tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          node -e '
            const fs = require("fs");
            const version = process.env.VERSION;
            for (const file of ["src-tauri/tauri.conf.json", "package.json"]) {
              const j = JSON.parse(fs.readFileSync(file, "utf8"));
              j.version = version;
              fs.writeFileSync(file, JSON.stringify(j, null, 2) + "\n");
            }
            const cargoPath = "src-tauri/Cargo.toml";
            let cargo = fs.readFileSync(cargoPath, "utf8");
            cargo = cargo.replace(/^version = "[^"]*"/m, "version = \"" + version + "\"");
            fs.writeFileSync(cargoPath, cargo);
          '

      - name: Build (single portable binary, no installer)
        run: npm run tauri build -- --no-bundle ${{ matrix.tauri-args }}

      - name: Functional test (extract embedded c2patool, analyze a real sample)
        run: cargo test --manifest-path src-tauri/Cargo.toml embedded_c2patool_analyzes_sample -- --nocapture

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "${{ matrix.built-path }}" -PassThru `
            -RedirectStandardOutput smoke-stdout.log -RedirectStandardError smoke-stderr.log

          # Poll instead of a single fixed sleep, so a slow-but-fine boot on a
          # loaded CI runner isn't mistaken for a broken app.
          $timeoutSeconds = 20
          $ready = $false
          for ($i = 0; $i -lt $timeoutSeconds; $i++) {
            Start-Sleep -Seconds 1
            if ($p.HasExited) {
              Write-Error "App exited early (code $($p.ExitCode)) - it likely failed to load its UI"
              Get-Content smoke-stdout.log, smoke-stderr.log -ErrorAction SilentlyContinue
              exit 1
            }
            $out = Get-Content smoke-stdout.log -ErrorAction SilentlyContinue
            if ($out -match "FRONTEND_READY") {
              $ready = $true
              break
            }
          }

          Stop-Process -Id $p.Id -Force
          $out = Get-Content smoke-stdout.log -ErrorAction SilentlyContinue
          $err = Get-Content smoke-stderr.log -ErrorAction SilentlyContinue
          Write-Host "--- stdout ---"; $out; Write-Host "--- stderr ---"; $err
          if (-not $ready) {
            Write-Error "Frontend never signaled it rendered within ${timeoutSeconds}s (FRONTEND_READY missing) - page may be blank/broken"
            exit 1
          }
          if ($err -match "CSP_VIOLATION") {
            Write-Error "A Content-Security-Policy violation was reported"
            exit 1
          }
          Write-Host "Frontend rendered and no CSP violations - OK"

      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: |
          chmod +x "${{ matrix.built-path }}"
          "${{ matrix.built-path }}" > smoke-stdout.log 2> smoke-stderr.log &
          APP_PID=$!

          # Poll instead of a single fixed sleep, so a slow-but-fine boot on a
          # loaded CI runner isn't mistaken for a broken app.
          timeout_seconds=20
          ready=0
          for i in $(seq 1 $timeout_seconds); do
            sleep 1
            if ! kill -0 $APP_PID 2>/dev/null; then
              echo "App exited unexpectedly - it likely failed to load its UI"
              cat smoke-stdout.log smoke-stderr.log
              exit 1
            fi
            if grep -q "FRONTEND_READY" smoke-stdout.log 2>/dev/null; then
              ready=1
              break
            fi
          done

          kill $APP_PID
          echo "--- stdout ---"; cat smoke-stdout.log
          echo "--- stderr ---"; cat smoke-stderr.log
          if [ "$ready" -ne 1 ]; then
            echo "Frontend never signaled it rendered within ${timeout_seconds}s (FRONTEND_READY missing) - page may be blank/broken"
            exit 1
          fi
          if grep -q "CSP_VIOLATION" smoke-stderr.log; then
            echo "A Content-Security-Policy violation was reported"
            exit 1
          fi
          echo "Frontend rendered and no CSP violations - OK"

      - name: Rename artifact
        shell: bash
        run: |
          mkdir -p dist-artifact
          cp "${{ matrix.built-path }}" "dist-artifact/${{ matrix.artifact-name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: dist-artifact/${{ matrix.artifact-name }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*/*
          draft: false
          make_latest: true

  release-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Remove previous rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest --repo ${{ github.repository }} --yes --cleanup-tag || true

      - name: Publish rolling "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest (main)"
          body: >-
            Automatically built from the latest commit on `main`
            (${{ github.sha }}). This is not a stable versioned release —
            see the tagged releases for those.
          files: artifacts/*/*
          draft: false
          prerelease: false
          make_latest: true
